name: fitlifeapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Fungsionalitas Tanggal
  intl: ^0.18.1

  # Image Upload
  image_picker: ^1.0.4

  # Launcher Icons & Splash Screen
  flutter_native_splash: ^2.3.11

  # --- FIREBASE DEPENDENCIES (BARU) ---
  firebase_storage: ^12.0.0 # Gunakan versi terbaru yang kompatibel
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/fitlife_icon.png
    - assets/splash/splash_logo.png
    - assets/images/
    - assets/workouts/


# --- KONFIGURASI ICON ---
flutter_launcher_icons:
  android: "fitlife_icon"
  ios: true
  image_path: "assets/icon/fitlife_icon.png"
  min_sdk_android: 21

# --- KONFIGURASI SPLASH SCREEN ---
flutter_native_splash:
  color: "#640A0A" # Warna latar belakang merah tua
  image: "assets/splash/splash_logo.png"