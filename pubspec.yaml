name: fitlifeapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Date/Localization functionality
  intl: ^0.18.1

  # Image Upload
  image_picker: ^1.0.4

  # --- FIREBASE DEPENDENCIES ---
  firebase_storage: ^12.0.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.1.5  # For Google services interaction

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0

  # Launcher Icons & Splash Screen Tools
  flutter_native_splash: ^2.3.11

flutter:
  uses-material-design: true

  assets:
    - assets/icon/fitlife_icon.png
    - assets/splash/splash_logo.png
    - assets/images/
    - assets/workouts/


# --- ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "fitlife_icon"
  ios: true
  image_path: "assets/icon/fitlife_icon.png"
  min_sdk_android: 21

# --- SPLASH SCREEN CONFIGURATION ---
flutter_native_splash:
  color: "#640A0A" # Dark red background color
  image: "assets/splash/splash_logo.png"