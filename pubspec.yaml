name: fitlifeapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Pastikan flutter_native_splash ada di dependencies, bukan dev_dependencies
  flutter_native_splash: ^2.3.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_launcher_icons harus di dev_dependencies
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^5.0.0

# Bagian di bawah ini harus sejajar dengan 'flutter:'

flutter:
  uses-material-design: true

  # --- DEKLARASI ASSETS (PENTING) ---
  assets:
    - assets/icon/fitlife_icon.png
    - assets/splash/splash_logo.png


# --- KONFIGURASI ICON ---
flutter_launcher_icons:
  android: "fitlife_icon"
  ios: true
  image_path: "assets/icon/fitlife_icon.png"
  min_sdk_android: 21

# --- KONFIGURASI SPLASH SCREEN (KESALAHAN DIPERBAIKI DI SINI) ---
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash/splash_logo.png"
  # Parameter yang benar untuk mencegah fullscreen dan menjaga status bar terlihat:
  android_fullscreen: false