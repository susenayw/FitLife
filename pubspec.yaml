name: fitlifeapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1 # <-- TAMBAHAN: Untuk State Management (Wajib untuk UserProvider)

  # Launcher Icons & Splash Screen (Aset Native)
  flutter_native_splash: ^2.3.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1 # Harus di dev_dependencies

  flutter_lints: ^5.0.0

# Bagian di bawah ini harus sejajar dengan 'flutter:'

flutter:
  uses-material-design: true

  # --- DEKLARASI ASSETS ---
  assets:
    - assets/icon/fitlife_icon.png
    - assets/splash/splash_logo.png
    - assets/images/ # Folder untuk background_man.jpg, gym_room.png, dll.


# --- KONFIGURASI ICON ---
flutter_launcher_icons:
  android: "fitlife_icon"
  ios: true
  image_path: "assets/icon/fitlife_icon.png"
  min_sdk_android: 21

# --- KONFIGURASI SPLASH SCREEN ---
flutter_native_splash:
  color: "#640A0A" # Warna latar belakang merah tua
  image: "assets/splash/splash_logo.png"
  # Parameter fullscreen dihilangkan untuk menghindari error